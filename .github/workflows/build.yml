name: Build Ornament animations

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # Builds every [env:*] in platformio.ini, i.e. every animation.
      - name: Build all animations
        run: pio run

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ornament-firmware
          path: .pio/build/*/firmware.hex
          if-no-files-found: error

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      # Publishes each animation to s3://unixvoid-builds/ornament/<name>/firmware.hex.
      # The env name is the animation name, so .pio/build/<name>/ maps directly onto
      # the key layout the web flasher lists. Animations are living examples, so the
      # keys are overwritten in place - there are no versions.
      - name: Publish animations to S3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          published=0
          for dir in .pio/build/*/; do
            name="$(basename "$dir")"
            hex="${dir}firmware.hex"
            [ -f "$hex" ] || continue
            echo "Publishing $name -> s3://unixvoid-builds/ornament/$name/firmware.hex"
            aws s3 cp "$hex" "s3://unixvoid-builds/ornament/$name/firmware.hex"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "No firmware.hex files found - nothing was built." >&2
            exit 1
          fi
          echo "Published $published animation(s)."
