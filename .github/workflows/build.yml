name: Build Ornament firmware

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]*'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install platform and custom board definition
        run: |
          pio pkg install --global --platform "atmelmegaavr@1.9.0"
          cp boards/ATtiny1614.json ~/.platformio/platforms/atmelmegaavr/boards/

      - name: Build firmware
        run: pio run -e attiny1614

      - name: Prepare release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p "release/ornament-${VERSION}"
          cp .pio/build/attiny1614/firmware.hex "release/ornament-${VERSION}/firmware.hex"
          cp .pio/build/attiny1614/firmware.elf "release/ornament-${VERSION}/firmware.elf"
          cp src/main.cpp "release/ornament-${VERSION}/main.cpp"
          (cd release && zip -j "ornament-${VERSION}.zip" "ornament-${VERSION}"/*)

      - name: Publish GitHub release with artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ornament-${{ env.VERSION }}.zip
            release/ornament-${{ env.VERSION }}/firmware.hex

      - name: Configure AWS credentials
        if: startsWith(github.ref, 'refs/tags/')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Upload firmware to S3
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          aws s3 cp .pio/build/attiny1614/firmware.hex "s3://unixvoid-builds/ornament/${VERSION}/firmware.hex"
